<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link
      rel="preload"
      href="/fonts/geist-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4a70" />
    <meta
      name="description"
      content="Mantenimientos, combustible, documentos y recordatorios de tu vehículo en un solo lugar. 14 días de prueba gratis."
    />
    <title>CarCheck — El historial de tu carro, en orden</title>
    <script>
      // La foto del hero es el LCP de la landing: se descubre antes de que React monte.
      if (window.location.pathname === '/') {
        var hero = document.createElement('link')
        hero.rel = 'preload'
        hero.as = 'image'
        hero.href = '/images/hero-driving.webp'
        hero.setAttribute('fetchpriority', 'high')
        document.head.appendChild(hero)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
